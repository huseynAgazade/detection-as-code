[project]
name = "detection-as-code"
version = "1.0.0"
description = "Detection engineering as code: validated, reviewed, and built from a single source of truth."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # long lines are reported by the formatter, not worth failing on
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

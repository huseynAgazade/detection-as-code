metadata:
  id: "WEB-WAF-001"
  name: "Credential Stuffing Against Public Login Endpoint"
  description: >-
    One source address submitted authentication attempts against the public login
    endpoint for a large number of distinct accounts in a short window, with almost
    all of them rejected. That shape, many accounts and few successes from a single
    origin, is credential stuffing: replaying username and password pairs harvested
    from unrelated breaches to find the ones the organisation's users reused. The
    rule reports the success count alongside the failure count, because a small
    number of successes inside a large failed run is the part that turns this from
    noise into an incident.
  author: "huseyn.aghazada"
  created: "2026-05-19"
  modified: "2026-08-12"
  version: "1.0.0"
  status: "experimental"
  severity: "high"
  confidence: "medium"

  tags:
    - "web"
    - "waf"
    - "credential.access"

  mitre:
    - tactic: "Credential Access"
      tactic_id: "TA0006"
      technique: "Brute Force: Credential Stuffing"
      technique_id: "T1110.004"

  data_sources:
    - "Web Application Firewall Logs"
    - "Reverse Proxy or Load Balancer Access Logs"

  platforms:
    - splunk

  lifecycle:
    soak_started: "2026-08-12"
    soak_days: 21
    owner: "huseyn.aghazada"

  risk:
    objects:
      - field: "src_ip"
        type: "network"
        score: 70
      - field: "site"
        type: "application"
        score: 50
    message: "Source $src_ip$ attempted authentication against $distinct_accounts$ distinct accounts on $site$, with $success_count$ succeeding."

  false_positives:
    - "Corporate egress addresses and carrier-grade NAT concentrate many legitimate users behind one address; tune by account-to-attempt ratio rather than by volume alone."
    - "Synthetic monitoring and load tests replay logins from a fixed address on a fixed schedule."
    - "A misconfigured client retrying a stale credential produces high failure counts, but against a single account rather than many."

  triage:
    - "Check the ratio of distinct accounts to attempts: stuffing touches each account once or twice, while brute force hammers one account."
    - "Confirm whether any attempt succeeded, and treat every successful account as compromised until the session is reviewed."
    - "Look at the user agent and request timing for automation signatures, and at whether the accounts exist at all, which distinguishes stuffing from enumeration."
    - "Force a password reset and session revocation on successful accounts, and rate-limit or block the source at the edge."

  references:
    - "https://attack.mitre.org/techniques/T1110/004/"
    - "https://owasp.org/www-community/attacks/Credential_stuffing"

detection:
  splunk:
    schedule:
      cron: "{{ schedule.fast }}"
      earliest: "-20m"
      latest: "-5m"

    query: |
      index={{ index.web }} sourcetype={{ sourcetype.web_access }}
          uri_path IN ({{ vars.login_endpoints }})
          http_method="POST"
          {{ exclusions.splunk.credential_stuffing_trusted_sources | default("") }}
      | eval outcome=case(status IN (200, 302), "success",
                          status IN (401, 403), "failure",
                          status == 429, "throttled",
                          true(), "other")
      | bin _time span=10m
      | stats dc(user) AS distinct_accounts
              count AS attempt_count
              sum(eval(outcome=="success")) AS success_count
              sum(eval(outcome=="failure")) AS failure_count
              values(http_user_agent) AS user_agents
              BY _time, src_ip, site
      | where distinct_accounts >= {{ thresholds.credential_stuffing_accounts }}
              AND failure_count >= {{ thresholds.credential_stuffing_failures }}
              AND failure_count > success_count
      | eval accounts_per_attempt=round(distinct_accounts / attempt_count, 2)
      | table _time, src_ip, site, distinct_accounts, attempt_count,
              failure_count, success_count, accounts_per_attempt, user_agents

    throttle:
      fields:
        - "src_ip"
      period: "6h"
